<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sky Squad TV community links for Discord, WhatsApp, merch, Facebook and Instagram."
    />
    <title>Sky Squad TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="brand-wrap">
        <img
          class="brand-logo"
          src="assets/logo.svg"
          alt="Sky Squad TV logo"
        />
      </div>

      <section class="links-panel" aria-label="Sky Squad TV links">
        <h1>Sky Squad TV</h1>
        <p class="tagline">Join the community</p>

        <nav class="link-stack" aria-label="Community links">
          <a class="link-button discord" href="https://discord.gg/9XZmsegWXm" target="_blank" rel="noreferrer">
            <span class="label">Members Only Discord</span>
            <span class="sub">Chat with the squad</span>
          </a>

          <a class="link-button whatsapp" href="https://whatsapp.com/channel/0029Vb97pnPF6smvdrVGtQ23" target="_blank" rel="noreferrer">
            <span class="label">WhatsApp Group</span>
            <span class="sub">Get updates fast</span>
          </a>

          <a class="link-button merch" href="https://www.skysquadtv.com" target="_blank" rel="noreferrer">
            <span class="label">Merch Store</span>
            <span class="sub">Shop the brand</span>
          </a>

          <a class="link-button facebook" href="https://www.facebook.com/skysquadtv/" target="_blank" rel="noreferrer">
            <span class="label">Facebook</span>
            <span class="sub">Follow the page</span>
          </a>

          <a class="link-button instagram" href="https://www.instagram.com/skysquad.tv" target="_blank" rel="noreferrer">
            <span class="label">Instagram</span>
            <span class="sub">See the latest posts</span>
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
